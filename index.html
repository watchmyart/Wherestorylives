<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Where story lives</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=Noto+Serif+KR:wght@300;400;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap"
    rel="stylesheet"
  >

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQyR5B3D5e5hZf6rXJw5cQ3jv1g1V5E="
    crossorigin=""
  />

  <style>

    :root {
      --bg-cream: #f7f3ed;
      --bg-card: #fdfbf7;
      --text-main: #3d352e;
      --text-sub: #7a7067;
      --border: #e8e0d5;
      --shadow: 0 12px 30px rgba(70, 55, 40, 0.09);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-cream);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
    }

    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      font-family: 'Playfair Display', serif;
    }

    .title-group p {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 3px;
    }

    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-header {
      background: var(--bg-cream);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-header:hover {
      background: #eee7dc;
      border-color: #c4b5a2;
    }

    .btn-header.active {
      background: #e5ded2;
      border-color: #9e5843;
    }

    /* =========================
       MAP
    ========================= */

    #map-container {
      flex: 1;
      position: relative;
      background: #eee8de;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .warm-ivory-tile {
      filter:
        sepia(35%)
        saturate(75%)
        hue-rotate(350deg)
        brightness(97%)
        contrast(95%);
    }

    /* =========================
       PIN
    ========================= */

    .custom-pin {
      position: relative;
      cursor: pointer;
    }

    .pin-icon {
      width: 28px;
      height: 28px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2.5px solid #ffffff;
      box-shadow: 0 4px 12px rgba(60, 45, 35, 0.35);
      transition: transform 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pin-icon::after {
      content: '';
      width: 8px;
      height: 8px;
      background: #ffffff;
      border-radius: 50%;
    }

    .custom-pin:hover .pin-icon {
      transform: rotate(-45deg) scale(1.22);
    }

    /* =========================
       여러 이야기가 있는 장소
    ========================= */

    .story-cluster-pin {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #806653;
      border: 3px solid white;
      box-shadow: 0 5px 15px rgba(60,45,35,.35);

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 15px;
      font-weight: 600;

      cursor: pointer;
      transition: transform .2s ease;
    }

    .story-cluster-pin:hover {
      transform: scale(1.12);
    }

    /* =========================
       MODAL
    ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(25,20,16,.65);
      backdrop-filter: blur(8px);

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 2000;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity .3s ease,
        visibility .3s ease;

      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: var(--bg-card);

      width: 100%;
      max-width: 1000px;

      height: 85vh;
      max-height: 740px;

      border-radius: 18px;

      box-shadow: 0 24px 60px rgba(25,18,12,.28);

      border: 1px solid var(--border);

      display: flex;
      flex-direction: column;

      overflow: hidden;

      position: relative;

      transform: translateY(20px) scale(.98);

      transition:
        transform .35s cubic-bezier(.16,1,.3,1);
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0) scale(1);
    }

    .btn-close-modal {
      position: absolute;

      top: 14px;
      right: 16px;

      width: 36px;
      height: 36px;

      background: rgba(253,251,247,.92);

      border: 1px solid var(--border);
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 1.15rem;

      color: var(--text-main);

      cursor: pointer;

      z-index: 30;
    }

    .modal-body {
      display: grid;

      grid-template-columns: 1.2fr 1fr;

      height: 100%;

      overflow: hidden;
    }

    /* =========================
       IMAGE
    ========================= */

    .modal-media-slider {
      position: relative;

      background: #14110f;

      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      user-select: none;
    }

    .slide-bg-blur {
      position: absolute;
      inset: -20px;

      background-size: cover;
      background-position: center;

      filter: blur(28px) brightness(.45) saturate(1.2);

      transform: scale(1.15);

      z-index: 1;
      opacity: .85;
    }

    .slide-img-wrapper {
      position: relative;

      z-index: 2;

      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 14px;
    }

    .slide-img {
      max-width: 100%;
      max-height: 100%;

      width: auto;
      height: auto;

      object-fit: contain;

      border-radius: 8px;

      box-shadow: 0 10px 30px rgba(0,0,0,.4);

      display: block;
    }

    /* =========================
       SLIDER
    ========================= */

    .slider-nav-btn {
      position: absolute;

      top: 50%;

      transform: translateY(-50%);

      width: 40px;
      height: 40px;

      background: rgba(253,251,247,.88);

      border: 1px solid rgba(255,255,255,.4);

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 1.4rem;

      color: var(--text-main);

      cursor: pointer;

      z-index: 10;
    }

    .slider-nav-btn.prev {
      left: 14px;
    }

    .slider-nav-btn.next {
      right: 14px;
    }

    .slider-bottom-bar {
      position: absolute;

      bottom: 14px;
      left: 14px;
      right: 14px;

      display: flex;

      justify-content: space-between;
      align-items: center;

      z-index: 10;
    }

    .slider-caption {
      background: rgba(20,16,12,.78);

      color: #f7f3ed;

      font-size: .75rem;

      padding: 6px 12px;

      border-radius: 6px;

      max-width: 68%;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .slider-dots {
      display: flex;
      gap: 6px;

      background: rgba(20,16,12,.55);

      padding: 6px 10px;

      border-radius: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;

      background: rgba(255,255,255,.45);

      border-radius: 50%;

      cursor: pointer;
    }

    .dot.active {
      background: white;

      width: 18px;

      border-radius: 4px;
    }

    /* =========================
       CONTENT
    ========================= */

    .modal-content-area {
      padding: 30px 28px 20px;

      display: flex;
      flex-direction: column;

      height: 100%;

      overflow: hidden;

      background: var(--bg-card);
    }

    .modal-scroll-content {
      flex: 1;

      overflow-y: auto;

      padding-right: 6px;

      margin-bottom: 12px;
    }

    .modal-header-tag {
      display: inline-block;

      font-size: .72rem;
      font-weight: 600;

      padding: 4px 10px;

      border-radius: 20px;

      margin-bottom: 10px;
    }

    .modal-author-name {
      font-size: .85rem;

      font-weight: 500;

      color: var(--text-sub);

      margin-bottom: 3px;
    }

    .modal-work-title {
      font-size: 1.4rem;

      font-weight: 600;

      color: var(--text-main);

      line-height: 1.35;

      margin-bottom: 6px;
    }

    .modal-place-name {
      font-size: .82rem;

      color: var(--text-sub);

      margin-bottom: 18px;
    }

    .quotes-wrapper {
      display: flex;
      flex-direction: column;

      gap: 14px;

      border-top: 1px dashed var(--border);

      border-bottom: 1px dashed var(--border);

      padding: 18px 0;

      margin-bottom: 14px;
    }

    .quote-item {
      font-family: 'Noto Serif KR', serif;

      font-size: .88rem;

      line-height: 1.75;

      color: #443c34;

      padding-left: 14px;

      border-left: 2.5px solid;

      white-space: pre-line;
    }

    .user-story-label {
      display: inline-block;

      font-size: .7rem;

      padding: 4px 9px;

      border-radius: 15px;

      background: #eee7dc;

      color: #706458;

      margin-bottom: 8px;
    }

    /* =========================
       FOOTER
    ========================= */

    .modal-fixed-footer {
      flex-shrink: 0;

      border-top: 1px solid var(--border);

      padding-top: 12px;
    }

    .modal-footer-note {
      font-size: .73rem;

      color: #a3998f;

      text-align: right;
    }

    /* =========================
       ADD STORY
    ========================= */

    .add-story-modal {
      position: fixed;

      inset: 0;

      background: rgba(25,20,16,.65);

      backdrop-filter: blur(8px);

      z-index: 3000;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;
    }

    .add-story-card {
      width: 100%;
      max-width: 520px;

      max-height: 90vh;

      overflow-y: auto;

      background: var(--bg-card);

      border-radius: 18px;

      padding: 26px;

      box-shadow: 0 24px 60px rgba(25,18,12,.3);

      border: 1px solid var(--border);

      position: relative;
    }

    .add-story-card h2 {
      font-family: 'Playfair Display', serif;

      font-size: 1.35rem;

      margin-bottom: 5px;
    }

    .add-story-description {
      color: var(--text-sub);

      font-size: .78rem;

      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;

      font-size: .78rem;

      font-weight: 500;

      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;

      padding: 11px 12px;

      border: 1px solid var(--border);

      border-radius: 9px;

      background: #fffdf9;

      color: var(--text-main);

      outline: none;

      font-size: .82rem;
    }

    .form-group textarea {
      min-height: 120px;

      resize: vertical;

      line-height: 1.6;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #b59b83;

      box-shadow: 0 0 0 3px rgba(181,155,131,.12);
    }

    .image-preview {
      width: 100%;

      max-height: 180px;

      object-fit: contain;

      border-radius: 10px;

      margin-top: 8px;

      display: none;

      background: #eee8de;
    }

    .form-buttons {
      display: flex;

      gap: 8px;

      margin-top: 20px;
    }

    .form-buttons button {
      flex: 1;

      padding: 11px;

      border-radius: 9px;

      border: 1px solid var(--border);

      cursor: pointer;

      font-size: .82rem;
    }

    .btn-cancel {
      background: var(--bg-cream);
      color: var(--text-main);
    }

    .btn-submit {
      background: #806653;
      color: white;
      border-color: #806653 !important;
    }

    .btn-submit:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* =========================
       STORY LIST
    ========================= */

    .story-list-modal {
      position: fixed;

      inset: 0;

      background: rgba(25,20,16,.55);

      backdrop-filter: blur(6px);

      z-index: 2500;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 20px;
    }

    .story-list-card {
      width: 100%;

      max-width: 500px;

      max-height: 80vh;

      overflow-y: auto;

      background: var(--bg-card);

      border: 1px solid var(--border);

      border-radius: 18px;

      padding: 24px;

      box-shadow: 0 20px 50px rgba(25,18,12,.25);
    }

    .story-list-title {
      font-size: 1.15rem;

      font-weight: 600;

      margin-bottom: 6px;
    }

    .story-list-place {
      color: var(--text-sub);

      font-size: .8rem;

      margin-bottom: 18px;
    }

    .story-list-item {
      width: 100%;

      text-align: left;

      background: var(--bg-cream);

      border: 1px solid var(--border);

      border-radius: 12px;

      padding: 14px;

      margin-bottom: 10px;

      cursor: pointer;
    }

    .story-list-item:hover {
      background: #eee7dc;

      border-color: #c4b5a2;
    }

    .story-list-item-title {
      font-weight: 600;

      color: var(--text-main);

      margin-bottom: 4px;
    }

    .story-list-item-author {
      font-size: .75rem;

      color: var(--text-sub);
    }

    .story-list-close {
      width: 100%;

      margin-top: 8px;

      padding: 10px;

      border: 1px solid var(--border);

      background: white;

      border-radius: 9px;

      cursor: pointer;

      color: var(--text-main);
    }

    /* =========================
       DELETE
    ========================= */

    .delete-story-btn {
      margin-top: 15px;

      width: 100%;

      padding: 9px;

      border-radius: 8px;

      border: 1px solid #dfc4c0;

      background: #fbefed;

      color: #9a4d43;

      cursor: pointer;

      font-size: .75rem;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 860px) {

      .modal-overlay {
        padding: 10px;
      }

      .modal-card {
        height: 94vh;
        max-height: 94vh;
      }

      .modal-body {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      .modal-media-slider {
        height: 320px;
        min-height: 260px;
      }

      .modal-content-area {
        padding: 18px 16px 14px;
      }
    }

    @media (max-width: 480px) {

      header {
        padding: 12px 16px;
      }

      .title-group h1 {
        font-size: 1.1rem;
      }

      .title-group p {
        display: none;
      }

      .header-controls {
        gap: 5px;
      }

      .btn-header {
        padding: 7px 9px;
        font-size: .7rem;
      }

      .modal-media-slider {
        height: 260px;
      }

    }

  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="title-group">

      <h1>Where story lives</h1>

      <p>
        문학과 영화 속 장소로 떠나보세요 · 핀을 누르면 음악과 이야기가 펼쳐집니다
      </p>

    </div>

    <div class="header-controls">

      <button
        id="btnToggleBgm"
        class="btn-header"
        onclick="toggleMainBgm()"
      >
        <span id="bgmIcon">🎵</span>
        <span id="bgmText">배경음악 ON</span>
      </button>

      <button
        class="btn-header"
        onclick="openAddStoryModal()"
      >
        ＋ Add your story
      </button>

      <button
        class="btn-header"
        onclick="resetView()"
      >
        초기 위치로
      </button>

    </div>

  </header>


  <!-- =========================
       MAP
  ========================= -->

  <div id="map-container">
    <div id="map"></div>
  </div>


  <!-- =========================
       DETAIL MODAL
  ========================= -->

  <div
    id="storyModal"
    class="modal-overlay"
    onclick="handleOverlayClick(event)"
  >

    <div class="modal-card">

      <button
        class="btn-close-modal"
        onclick="closeModal()"
      >
        ✕
      </button>

      <div class="modal-body">

        <!-- IMAGE -->

        <div class="modal-media-slider">

          <div
            id="slideBgBlur"
            class="slide-bg-blur"
          ></div>

          <div class="slide-img-wrapper">

            <img
              id="slideImg"
              class="slide-img"
              src=""
              alt="장소 사진"
            />

          </div>

          <button
            id="btnPrevSlide"
            class="slider-nav-btn prev"
            onclick="prevSlide()"
          >
            ‹
          </button>

          <button
            id="btnNextSlide"
            class="slider-nav-btn next"
            onclick="nextSlide()"
          >
            ›
          </button>

          <div class="slider-bottom-bar">

            <div
              id="slideCaption"
              class="slider-caption"
            ></div>

            <div
              id="sliderDots"
              class="slider-dots"
            ></div>

          </div>

        </div>


        <!-- TEXT -->

        <div class="modal-content-area">

          <div class="modal-scroll-content">

            <span
              id="modalTag"
              class="modal-header-tag"
            ></span>

            <div
              id="modalAuthor"
              class="modal-author-name"
            ></div>

            <h2
              id="modalTitle"
              class="modal-work-title"
            ></h2>

            <div
              id="modalPlace"
              class="modal-place-name"
            ></div>

            <div
              id="modalQuotes"
              class="quotes-wrapper"
            ></div>

            <div id="modalUserInfo"></div>

          </div>

          <div class="modal-fixed-footer">

            <div class="modal-footer-note">
              Where story lives Collection
            </div>

          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- =========================
       STORY LIST
  ========================= -->

  <div
    id="storyListModal"
    class="story-list-modal"
  >

    <div class="story-list-card">

      <div
        class="story-list-title"
        id="storyListTitle"
      >
        이 장소의 이야기
      </div>

      <div
        class="story-list-place"
        id="storyListPlace"
      ></div>

      <div
        id="storyListItems"
      ></div>

      <button
        class="story-list-close"
        onclick="closeStoryList()"
      >
        닫기
      </button>

    </div>

  </div>


  <!-- =========================
       ADD STORY MODAL
  ========================= -->

  <div
    id="addStoryModal"
    class="add-story-modal"
  >

    <div class="add-story-card">

      <button
        class="btn-close-modal"
        onclick="closeAddStoryModal()"
      >
        ✕
      </button>

      <h2>Add your story</h2>

      <p class="add-story-description">
        당신의 이야기가 머물렀던 장소를 지도에 남겨보세요.
      </p>


      <!-- 닉네임 -->

      <div class="form-group">

        <label>
          누구의 이야기인가요?
        </label>

        <input
          id="storyNickname"
          type="text"
          placeholder="닉네임을 입력해주세요"
        >

      </div>


      <!-- 장소 -->

      <div class="form-group">

        <label>
          장소 이름
        </label>

        <input
          id="storyCity"
          type="text"
          placeholder="예: 서울 남산"
        >

      </div>


      <!-- 위도 -->

      <div class="form-group">

        <label>
          위도 (Latitude)
        </label>

        <input
          id="storyLat"
          type="number"
          step="any"
          placeholder="예: 37.5512"
        >

      </div>


      <!-- 경도 -->

      <div class="form-group">

        <label>
          경도 (Longitude)
        </label>

        <input
          id="storyLng"
          type="number"
          step="any"
          placeholder="예: 126.9882"
        >

      </div>


      <!-- 사진 -->

      <div class="form-group">

        <label>
          사진
        </label>

        <input
          id="storyImage"
          type="file"
          accept="image/*"
          onchange="previewStoryImage(event)"
        >

        <img
          id="imagePreview"
          class="image-preview"
          alt="사진 미리보기"
        >

      </div>


      <!-- 명대사 -->

      <div class="form-group">

        <label>
          이 장소에 남기고 싶은 이야기 / 명대사
        </label>

        <textarea
          id="storyQuote"
          placeholder="이 장소와 관련된 문장이나 이야기를 적어주세요."
        ></textarea>

      </div>


      <div class="form-buttons">

        <button
          class="btn-cancel"
          onclick="closeAddStoryModal()"
        >
          취소
        </button>

        <button
          id="submitStoryButton"
          class="btn-submit"
          onclick="submitStory()"
        >
          이야기 추가하기
        </button>

      </div>

    </div>

  </div>

      "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
      {

          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',

    // ============================================================
    // 좌표를 같은 장소로 묶기
    // ============================================================

    function getLocationKey(latlng) {

      return `${Number(latlng[0]).toFixed(4)},${Number(latlng[1]).toFixed(4)}`;

    }


    // ============================================================
    // 새 장소 핀 색 자동 결정
    // ============================================================

    function getAutomaticPinColor(item) {

      const text = `
        ${item.name || ""}
        ${item.title || ""}
        ${item.author || ""}
        ${item.quote || ""}
      `.toLowerCase();


      if (
        text.includes("바다") ||
        text.includes("해변") ||
        text.includes("sea") ||
        text.includes("beach")
      ) {
        return "#397d8a";
      }


      if (
        text.includes("눈") ||
        text.includes("겨울") ||
        text.includes("설국") ||
        text.includes("snow") ||
        text.includes("winter")
      ) {
        return "#4e6a82";
      }


      if (
        text.includes("벚꽃") ||
        text.includes("벚나무") ||
        text.includes("사쿠라") ||
        text.includes("cherry")
      ) {
        return "#c26d7b";
      }


      if (
        text.includes("여름") ||
        text.includes("summer")
      ) {
        return "#6c804b";
      }


      if (
        text.includes("사랑") ||
        text.includes("love") ||
        text.includes("로맨스")
      ) {
        return "#9b2226";
      }


      if (
        text.includes("런던") ||
        text.includes("홍콩") ||
        text.includes("파리") ||
        text.includes("뉴욕") ||
        text.includes("도시")
      ) {
        return "#69487d";
      }


      return "#806653";

    }


    // ============================================================
    // Supabase 데이터 → 사이트 데이터
    // ============================================================

    function convertSupabaseStory(row) {

      return {

        id: `user-${row.id}`,

        dbId: row.id,

        isUserStory: true,

        name: row.city_name,

        type: "user",

        author: row.nickname
          ? `by ${row.nickname}`
          : "익명의 이야기",

        title: row.city_name,

        latlng: [
          Number(row.lat),
          Number(row.lng)
        ],

        pinColor: getAutomaticPinColor(row),

        tagBg: "#eee7dc",

        tagColor: "#6b5b4d",

        photos: row.image_url
          ? [
              {
                url: row.image_url,
                caption: "사용자가 남긴 사진"
              }
            ]
          : [],

        quotes: row.quote
          ? [row.quote]
          : [],

        nickname: row.nickname,

        created_at: row.created_at

      };

    }


    // ============================================================
    // DB에서 사용자 이야기 가져오기
    // ============================================================

    async function loadUserStories() {

      try {

        const rows = await supabaseRequest(
          `${TABLE_URL}?select=*`
        );

        const userStories =
          (rows || []).map(convertSupabaseStory);

        allStories = [
          ...storyPlaces,
          ...userStories
        ];

        renderAllMarkers();

      } catch (error) {

        console.error(
          "사용자 이야기를 불러오지 못했습니다:",
          error
        );

      }

    }


    // ============================================================
    // 모든 핀 표시
    // ============================================================

    function renderAllMarkers() {

      // 기존 마커 제거

      Object.values(markerGroups).forEach(group => {

        group.forEach(item => {

          if (item.marker) {

            map.removeLayer(item.marker);

          }

        });

      });


      // 그룹 초기화

      Object.keys(markerGroups).forEach(key => {

        delete markerGroups[key];

      });


      // 같은 좌표끼리 묶기

      allStories.forEach(item => {

        if (
          !item.latlng ||
          item.latlng.length !== 2 ||
          isNaN(item.latlng[0]) ||
          isNaN(item.latlng[1])
        ) {
          return;
        }

        const key =
          getLocationKey(item.latlng);

        if (!markerGroups[key]) {

          markerGroups[key] = [];

        }

        markerGroups[key].push(item);

      });


      // 핀 생성

      Object.values(markerGroups).forEach(group => {

        const first =
          group[0];


        // ================================================
        // 한 개의 이야기
        // ================================================

        if (group.length === 1) {

          const item = group[0];


          const icon =
            L.divIcon({

              className: "custom-pin",

              html: `
                <div
                  class="pin-icon"
                  style="
                    background-color:
                    ${item.pinColor || getAutomaticPinColor(item)};
                  "
                ></div>
              `,

              iconSize: [28,28],

              iconAnchor: [14,28]

            });


          const marker =
            L.marker(
              item.latlng,
              {
                icon
              }
            ).addTo(map);


          marker.on(
            "click",
            () => openStoryModal(item)
          );


          item.marker = marker;

        }


        // ================================================
        // 여러 이야기
        // ================================================

        else {

          const icon =
            L.divIcon({

              className: "",

              html: `
                <div class="story-cluster-pin">
                  ${group.length}
                </div>
              `,

              iconSize: [42,42],

              iconAnchor: [21,21]

            });


          const marker =
            L.marker(
              first.latlng,
              {
                icon
              }
            ).addTo(map);


          marker.on(
            "click",
            () => openStoryList(group)
          );


          group.forEach(item => {

            item.marker = marker;

          });

        }

      });

    }


    // ============================================================
    // STORY LIST
    // ============================================================

    function openStoryList(group) {

      const modal =
        document.getElementById("storyListModal");

      const title =
        document.getElementById("storyListTitle");

      const place =
        document.getElementById("storyListPlace");

      const items =
        document.getElementById("storyListItems");


      title.textContent =
        `${group.length}개의 이야기`;


      place.textContent =
        `📍 ${group[0].name}`;


      items.innerHTML = "";


      group.forEach(item => {

        const button =
          document.createElement("button");

        button.className =
          "story-list-item";


        button.innerHTML = `

          <div class="story-list-item-title">
            ${escapeHtml(
              item.title ||
              item.name ||
              "이야기"
            )}
          </div>

          <div class="story-list-item-author">
            ${escapeHtml(
              item.nickname ||
              item.author ||
              "익명의 이야기"
            )}
          </div>

        `;


        button.onclick = () => {

          closeStoryList();

          setTimeout(
            () => openStoryModal(item),
            100
          );

        };


        items.appendChild(button);

      });


      modal.style.display = "flex";

    }


    function closeStoryList() {

      document.getElementById(
        "storyListModal"
      ).style.display = "none";

    }

      document.getElementById("modalTitle");

    const modalPlace =
      document.getElementById("modalPlace");

    const modalQuotes =
      document.getElementById("modalQuotes");

    const modalUserInfo =
      document.getElementById("modalUserInfo");


    let currentPhotos = [];

    let currentPhotoIndex = 0;

    let currentStory = null;


    // ============================================================
    // HTML 안전 처리
    // ============================================================

    function escapeHtml(value) {

      if (value === null || value === undefined) {
        return "";
      }

      return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

    }


    // ============================================================
    // 이야기 상세 열기
    // ============================================================

    function openStoryModal(item) {

      currentStory = item;

      currentPhotos =
        item.photos || [];

      currentPhotoIndex = 0;


      if (item.isUserStory) {

        modalTag.textContent =
          "사용자가 남긴 이야기";

        modalTag.style.backgroundColor =
          "#eee7dc";

        modalTag.style.color =
          "#6b5b4d";

      }

      else {

        modalTag.textContent =
          item.type === "book"
            ? "소설 속 문장 & 실제 장소"
            : item.type === "drama"
              ? "드라마 속 명대사 & 장면"
              : "영화 속 명대사 & 장면";

        modalTag.style.backgroundColor =
          item.tagBg;

        modalTag.style.color =
          item.tagColor;

      }


      modalAuthor.textContent =
        item.isUserStory
          ? `by ${item.nickname || "익명의 사용자"}`
          : item.author || "";


      modalTitle.textContent =
        item.title || "";


      modalPlace.textContent =
        `📍 ${item.name || ""}`;


      modalQuotes.innerHTML = "";


      (item.quotes || []).forEach(
        quote => {

          const quoteEl =
            document.createElement("div");

          quoteEl.className =
            "quote-item";

          quoteEl.style.borderLeftColor =
            item.pinColor ||
            getAutomaticPinColor(item);


          quoteEl.textContent =
            quote;


          modalQuotes.appendChild(
            quoteEl
          );

        }
      );


      // 사용자 이야기 정보

      modalUserInfo.innerHTML = "";


      if (item.isUserStory) {

        const label =
          document.createElement("span");

        label.className =
          "user-story-label";

        label.textContent =
          `이야기를 남긴 사람 · ${
            item.nickname || "익명"
          }`;


        modalUserInfo.appendChild(
          label
        );


        // 사용자 이야기 삭제 버튼

        const deleteButton =
          document.createElement("button");

        deleteButton.className =
          "delete-story-btn";

        deleteButton.textContent =
          "이 이야기 삭제";


        deleteButton.onclick =
          () => deleteUserStory(item);


        modalUserInfo.appendChild(
          deleteButton
        );

      }


      renderSlide();

      modal.classList.add("active");

    }


    // ============================================================
    // SLIDER
    // ============================================================

    function renderSlide() {

      if (!currentPhotos.length) {

        slideImg.style.display = "none";

        slideBgBlur.style.backgroundImage =
          "none";

        slideCaption.textContent =
          "사진이 없습니다.";

        btnPrevSlide.style.display =
          "none";

        btnNextSlide.style.display =
          "none";

        sliderDots.style.display =
          "none";

        return;

      }


      slideImg.style.display =
        "block";


      const current =
        currentPhotos[currentPhotoIndex];


      slideImg.src =
        current.url;


      slideBgBlur.style.backgroundImage =
        `url("${current.url}")`;


      slideCaption.textContent =
        current.caption || "";


      if (currentPhotos.length > 1) {

        btnPrevSlide.style.display =
          "flex";

        btnNextSlide.style.display =
          "flex";

        sliderDots.style.display =
          "flex";


        sliderDots.innerHTML = "";


        currentPhotos.forEach(
          (_, index) => {

            const dot =
              document.createElement("div");

            dot.className =
              `dot ${
                index === currentPhotoIndex
                  ? "active"
                  : ""
              }`;


            dot.onclick =
              () => goToSlide(index);


            sliderDots.appendChild(
              dot
            );

          }
        );

      }

      else {

        btnPrevSlide.style.display =
          "none";

        btnNextSlide.style.display =
          "none";

        sliderDots.style.display =
          "none";

      }

    }


    function prevSlide() {

      if (currentPhotos.length <= 1)
        return;

      currentPhotoIndex =
        (
          currentPhotoIndex -
          1 +
          currentPhotos.length
        ) %
        currentPhotos.length;

      renderSlide();

    }


    function nextSlide() {

      if (currentPhotos.length <= 1)
        return;

      currentPhotoIndex =
        (
          currentPhotoIndex + 1
        ) %
        currentPhotos.length;

      renderSlide();

    }


    function goToSlide(index) {

      currentPhotoIndex =
        index;

      renderSlide();

    }


    function closeModal() {

      modal.classList.remove("active");

      currentStory = null;

    }


    function handleOverlayClick(event) {

      if (event.target === modal) {

        closeModal();

      }

    }


    // ============================================================
    // ADD STORY
    // ============================================================

    function openAddStoryModal() {

      document.getElementById(
        "addStoryModal"
      ).style.display = "flex";

    }


    function closeAddStoryModal() {

      document.getElementById(
        "addStoryModal"
      ).style.display = "none";

    }


    // ============================================================
    // 이미지 미리보기
    // ============================================================

    function previewStoryImage(event) {

      const file =
        event.target.files[0];

      const preview =
        document.getElementById(
          "imagePreview"
        );


      if (!file) {

        preview.style.display =
          "none";

        return;

      }


      preview.src =
        URL.createObjectURL(file);

      preview.style.display =
        "block";

    }


    // ============================================================
    // 이야기 추가
    // ============================================================

    async function submitStory() {

      const nickname =
        document.getElementById(
          "storyNickname"
        ).value.trim();


      const cityName =
        document.getElementById(
          "storyCity"
        ).value.trim();


      const lat =
        Number(
          document.getElementById(
            "storyLat"
          ).value
        );


      const lng =
        Number(
          document.getElementById(
            "storyLng"
          ).value
        );


      const quote =
        document.getElementById(
          "storyQuote"
        ).value.trim();


      const imageInput =
        document.getElementById(
          "storyImage"
        );


      const file =
        imageInput.files[0];


      // =========================
      // 입력 확인
      // =========================

      if (!nickname) {

        alert(
          "닉네임을 입력해주세요."
        );

        return;

      }


      if (!cityName) {

        alert(
          "장소 이름을 입력해주세요."
        );

        return;

      }


      if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
      ) {

        alert(
          "위도와 경도를 정확하게 입력해주세요."
        );

        return;

      }


      if (!file) {

        alert(
          "사진을 선택해주세요."
        );

        return;

      }


      const submitButton =
        document.getElementById(
          "submitStoryButton"
        );


      try {

        submitButton.disabled =
          true;

        submitButton.textContent =
          "업로드 중...";


        // =====================================================
        // 1. 사진 파일명 만들기
        // =====================================================

        const extension =
          file.name.includes(".")
            ? file.name.split(".").pop()
            : "jpg";


        const fileName =
          `${Date.now()}-${Math.random()
            .toString(36)
            .substring(2)}.${extension}`;


        // =====================================================
        // 2. Storage 업로드
        // =====================================================

        const uploadUrl =
          `${SUPABASE_URL}/storage/v1/object/city-images/${fileName}`;


        const uploadResponse =
          await fetch(
            uploadUrl,
            {

              method: "POST",

              headers: {

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  `Bearer ${SUPABASE_KEY}`,

                "Content-Type":
                  file.type || "image/jpeg",

                "x-upsert":
                  "false"

              },

              body: file

            }
          );


        if (!uploadResponse.ok) {

          const error =
            await uploadResponse.text();

          throw new Error(
            `사진 업로드 실패: ${error}`
          );

        }


        // =====================================================
        // 3. 공개 이미지 URL
        // =====================================================

        const imageUrl =
          `${STORAGE_URL}/${fileName}`;


        // =====================================================
        // 4. Database에 정보 저장
        // =====================================================

        const newStory = {

          city_name: cityName,

          image_url: imageUrl,

          lat: lat,

          lng: lng,

          nickname: nickname,

          quote: quote

        };


        await supabaseRequest(
          TABLE_URL,
          {

            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "Prefer":
                "return=minimal"

            },

            body:
              JSON.stringify(newStory)

          }
        );


        // =====================================================
        // 5. 성공
        // =====================================================

        alert(
          "이야기가 지도에 추가되었습니다! ✨"
        );


        closeAddStoryModal();


        // 폼 초기화

        document.getElementById(
          "storyNickname"
        ).value = "";


        document.getElementById(
          "storyCity"
        ).value = "";


        document.getElementById(
          "storyLat"
        ).value = "";


        document.getElementById(
          "storyLng"
        ).value = "";


        document.getElementById(
          "storyQuote"
        ).value = "";


        imageInput.value = "";


        document.getElementById(
          "imagePreview"
        ).style.display =
          "none";


        // DB 다시 읽기

        await loadUserStories();


      }

      catch (error) {

        console.error(error);

        alert(
          "이야기를 추가하는 중 오류가 발생했습니다.\n\n" +
          error.message
        );

      }

      finally {

        submitButton.disabled =
          false;

        submitButton.textContent =
          "이야기 추가하기";

      }

    }


    // ============================================================
    // 사용자 이야기 삭제
    // ============================================================

    async function deleteUserStory(item) {

      if (!item.dbId) {

        alert(
          "기존에 등록되어 있는 장소는 삭제할 수 없습니다."
        );

        return;

      }


      const confirmed =
        confirm(
          "정말 이 이야기를 삭제할까요?"
        );


      if (!confirmed) return;


      try {

        await supabaseRequest(
          `${TABLE_URL}?id=eq.${encodeURIComponent(
            item.dbId
          )}`,
          {

            method: "DELETE",

            headers: {

              "Prefer":
                "return=minimal"

            }

          }
        );


        alert(
          "이야기가 삭제되었습니다."
        );


        closeModal();

        await loadUserStories();


      }

      catch (error) {

        console.error(error);

        alert(
          "삭제 중 오류가 발생했습니다.\n\n" +
          error.message
        );

      }

    }


    // ============================================================
    // 키보드
    // ============================================================

    window.addEventListener(
      "keydown",
      event => {

        if (
          !modal.classList.contains(
            "active"
          )
        ) {
          return;
        }


        if (
          event.key === "Escape"
        ) {

          closeModal();

        }


        if (
          event.key === "ArrowLeft"
        ) {

          prevSlide();

        }


        if (
          event.key === "ArrowRight"
        ) {

          nextSlide();

        }

      }
    );


    // ============================================================
    // 초기 위치
    // ============================================================

    function resetView() {

      map.flyTo(
        initialCenter,
        initialZoom,
        {
          duration: 1.2
        }
      );

    }


    // ============================================================
    // 배경 음악
    // ============================================================

    const mainBgm =
      new Audio("main.mp3");

    mainBgm.loop = true;

    mainBgm.volume = .35;

    let isMainBgmPlaying = false;


    function toggleMainBgm() {

      if (isMainBgmPlaying) {

        mainBgm.pause();

        isMainBgmPlaying = false;

      }

      else {

        mainBgm.play()
          .then(() => {

            isMainBgmPlaying = true;

            updateBgmButtonUI();

          })
          .catch(() => {});

      }


      updateBgmButtonUI();

    }


    function updateBgmButtonUI() {

      const icon =
        document.getElementById(
          "bgmIcon"
        );

      const text =
        document.getElementById(
          "bgmText"
        );


      if (isMainBgmPlaying) {

        icon.textContent = "🎵";

        text.textContent =
          "배경음악 ON";

      }

      else {

        icon.textContent = "🔇";

        text.textContent =
          "배경음악 OFF";

      }

    }


    // ============================================================
    // 시작
    // ============================================================

    // 기존 8개 먼저 표시
    renderAllMarkers();

    // Supabase 사용자 이야기 가져오기
    loadUserStories();

  </script>

</body>
</html>
