function autoStartBgmOnce() {

  if (!isMainBgmPlaying) {

    mainBgm.play().then(() => {

      isMainBgmPlaying = true;
      updateBgmButtonUI();

    }).catch(() => {});

  }

  document.removeEventListener(
    "click",
    autoStartBgmOnce
  );
}


document.addEventListener(
  "click",
  autoStartBgmOnce,
  { once: true }
);


function toggleMainBgm() {

  if (isMainBgmPlaying) {

    mainBgm.pause();
    isMainBgmPlaying = false;

  } else {

    mainBgm.play().then(() => {

      isMainBgmPlaying = true;
      updateBgmButtonUI();

    }).catch(() => {});

  }

  updateBgmButtonUI();
}

  const btn =
    document.getElementById("btnToggleBgm");

  const icon =
    document.getElementById("bgmIcon");

  const text =
    document.getElementById("bgmText");


  if (isMainBgmPlaying) {

    btn.classList.add("active");
    icon.textContent = "🎵";
    text.textContent = "배경음악 ON";

  } else {

    btn.classList.remove("active");
    icon.textContent = "🔇";
    text.textContent = "배경음악 OFF";

}

function addStoryMarker(item, isUserStory = false) {

  const customIcon = L.divIcon({

    className: "custom-pin",

    html:
      `<div class="pin-icon"
            style="background-color:${item.pinColor || "#9e5843"};">
       </div>`,

    iconSize: [28, 28],

    iconAnchor: [14, 28]

  });


  const marker =
    L.marker(item.latlng, {
      icon: customIcon
    }).addTo(map);


  marker.on("click", () => {

    openStoryModal(item);

  });


  if (isUserStory) {

    item._marker = marker;

  }


  return marker;
}

/* =========================================================
   Supabase API
========================================================= */

async function supabaseRequest(
  endpoint,
  options = {}
) {

  const response = await fetch(
    `${SUPABASE_URL}${endpoint}`,
    {
      ...options,

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",

        ...(options.headers || {})
      }
    }
  );


  if (!response.ok) {

    const errorText =
      await response.text();

    throw new Error(errorText);

  }


  if (response.status === 204) {
    return null;
  }


  return response.json();
}


/* =========================================================
   사용자 이야기 불러오기
========================================================= */

async function loadUserStories() {

  try {

    const data =
      await supabaseRequest(
        "/rest/v1/city_images?select=*"
      );


    if (!Array.isArray(data)) {
      return;
    }


    userStories = data.map(row => {

      return {

        id: `user-${row.id}`,

        databaseId: row.id,

        name: row.city_name,

        type: "user",

        author: row.nickname || "익명의 여행자",

        title: "나의 이야기",

        latlng: [
          Number(row.lat),
          Number(row.lng)
        ],

        pinColor: "#9e5843",

        tagBg: "#f5e9e3",

        tagColor: "#7d4635",

        photos: row.image_url
          ? [
              {
                url: row.image_url,
                caption: "사용자가 남긴 사진"
              }
            ]
          : [],

        quotes: row.quote
          ? [row.quote]
          : ["아직 이야기가 없습니다."],

        isUserStory: true,

        storageUrl: row.image_url || null

      };

    });


    userStories.forEach(item => {

      if (
        Number.isFinite(item.latlng[0]) &&
        Number.isFinite(item.latlng[1])
      ) {

        addStoryMarker(item, true);

      }

    });


  } catch (error) {

    console.error(
      "사용자 이야기를 불러오지 못했습니다:",
      error
    );

  }

}


/* 페이지가 열리면 Supabase에서 이야기 가져오기 */

loadUserStories();


/* =========================================================
   장소명 → 위도/경도 검색
   OpenStreetMap Nominatim 사용
========================================================= */

async function findLocation(placeName) {

  const status =
    document.getElementById("locationStatus");


  status.textContent =
    "📍 장소 위치를 찾고 있습니다...";


  try {

    const url =
      "https://nominatim.openstreetmap.org/search" +
      "?format=json" +
      "&limit=1" +
      "&accept-language=ko" +
      "&q=" +
      encodeURIComponent(placeName);


    const response =
      await fetch(url);


    if (!response.ok) {
      throw new Error("장소 검색 실패");
    }


    const data =
      await response.json();


    if (!data.length) {

      status.textContent =
        "❌ 장소를 찾지 못했습니다. 조금 더 구체적으로 입력해주세요.";

      return null;

    }


    const result = data[0];


    const lat =
      Number(result.lat);

    const lng =
      Number(result.lon);


    status.textContent =
      `✓ 위치 확인: ${result.display_name}`;


    return {
      lat,
      lng
    };


  } catch (error) {

    console.error(error);


    status.textContent =
      "❌ 장소 위치를 찾는 중 오류가 발생했습니다.";

    return null;

  }

}

/* =========================================================
   사진 파일명 만들기
========================================================= */

function createSafeFileName(originalName) {

  const extension =
    originalName.includes(".")
      ? originalName.split(".").pop()
      : "jpg";


  return (
    `${Date.now()}-${Math.random()
      .toString(36)
      .substring(2, 10)}.${extension}`
  );

}


/* =========================================================
   Supabase Storage 업로드
========================================================= */

async function uploadImage(file) {

  const fileName =
    createSafeFileName(file.name);


  const uploadUrl =
    `${SUPABASE_URL}/storage/v1/object/` +
    `${SUPABASE_BUCKET}/${fileName}`;


  const response =
    await fetch(uploadUrl, {

      method: "POST",

      headers: {

        "apikey": SUPABASE_KEY,

        "Authorization":
          `Bearer ${SUPABASE_KEY}`,

        "Content-Type":
          file.type || "application/octet-stream"

      },

      body: file

    });


  if (!response.ok) {

    const error =
      await response.text();

    throw new Error(
      `사진 업로드 실패: ${error}`
    );

  }


  const publicUrl =
    `${SUPABASE_URL}/storage/v1/object/public/` +
    `${SUPABASE_BUCKET}/${fileName}`;


  return publicUrl;

}


/* =========================================================
   이야기 추가
========================================================= */

async function submitStory() {

  const city =
    document
      .getElementById("storyCity")
      .value
      .trim();


  const nickname =
    document
      .getElementById("storyNickname")
      .value
      .trim();


  const quote =
    document
      .getElementById("storyQuote")
      .value
      .trim();


  const file =
    document
      .getElementById("storyPhoto")
      .files[0];


  if (!city) {

    alert("장소를 입력해주세요.");

    return;

  }


  if (!nickname) {

    alert("닉네임을 입력해주세요.");

    return;

  }


  if (!quote) {

    alert("명대사나 이야기를 입력해주세요.");

    return;

  }


  if (!file) {

    alert("사진을 선택해주세요.");

    return;

  }


  const submitButton =
    document.getElementById(
      "submitStoryBtn"
    );


  const loading =
    document.getElementById(
      "loadingMessage"
    );


  submitButton.disabled = true;

  loading.style.display = "block";


  try {

    /* ---------------------------------
       1. 장소 위치 찾기
    --------------------------------- */

    const location =
      await findLocation(city);


    if (!location) {

      throw new Error(
        "장소의 위치를 찾지 못했습니다."
      );

    }


    /* ---------------------------------
       2. 사진 Storage 업로드
    --------------------------------- */

    const imageUrl =
      await uploadImage(file);


    /* ---------------------------------
       3. Database 저장
    --------------------------------- */

    const inserted =
      await supabaseRequest(
        "/rest/v1/city_images",
        {

          method: "POST",

          headers: {
            "Prefer": "return=representation"
          },

          body: JSON.stringify({

            city_name: city,

            image_url: imageUrl,

            nickname: nickname,

            quote: quote,

            lat: location.lat,

            lng: location.lng

          })

        }
      );


    const row =
      Array.isArray(inserted)
        ? inserted[0]
        : inserted;


    /* ---------------------------------
       4. 화면에 즉시 표시
    --------------------------------- */

    const newStory = {

      id: `user-${row.id}`,

      databaseId: row.id,

      name: city,

      type: "user",

      author: nickname,

      title: "나의 이야기",

      latlng: [
        location.lat,
        location.lng
      ],

      pinColor: "#9e5843",

      tagBg: "#f5e9e3",

      tagColor: "#7d4635",

      photos: [
        {
          url: imageUrl,
          caption: `${nickname}의 사진`
        }
      ],

      quotes: [quote],

      isUserStory: true,

      storageUrl: imageUrl

    };


    userStories.push(newStory);


    addStoryMarker(
      newStory,
      true
    );


    /* ---------------------------------
       5. 입력창 초기화
    --------------------------------- */

    document
      .getElementById("storyCity")
      .value = "";


    document
      .getElementById("storyNickname")
      .value = "";


    document
      .getElementById("storyQuote")
      .value = "";


    document
      .getElementById("storyPhoto")
      .value = "";


    document
      .getElementById("locationStatus")
      .textContent =
      "장소를 입력하면 지도 위치를 찾습니다.";


    closeAddStoryModal();


    /* 추가된 장소로 지도 이동 */

    map.flyTo(
      [
        location.lat,
        location.lng
      ],
      10,
      {
        duration: 1.2
      }
    );


    /* 바로 이야기 열기 */

    setTimeout(() => {

      openStoryModal(newStory);

    }, 800);


    alert(
      "✨ 이야기가 성공적으로 추가되었습니다!"
    );


  } catch (error) {

    console.error(error);

    alert(
      "이야기를 추가하지 못했습니다.\n\n" +
      error.message
    );

  } finally {

    submitButton.disabled = false;

    loading.style.display = "none";

  }

}

const modalTag =

const modalAuthor =

      : null;

  } else {

          .replace(/\n/g, "<br>");

      );

  if (

    placeAudio.play()
      .catch(() => {});

  }


  renderSlide();

/* =========================================================
   HTML 특수문자 처리
========================================================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");


  div.textContent =
    text || "";


  return div.innerHTML;

}


/* =========================================================
   사진 슬라이더
========================================================= */

function renderSlide() {

  if (!currentPhotos.length) {

    slideImg.src = "";

    slideCaption.textContent =
      "사진이 없습니다.";

    return;

  }


  const current =
    currentPhotos[currentPhotoIndex];


  slideImg.src =
    current.url;


  slideBgBlur.style.backgroundImage =
    `url("${current.url}")`;


  slideCaption.textContent =
    current.caption || "";


  if (currentPhotos.length > 1) {

    btnPrevSlide.style.display =
      "flex";

    btnNextSlide.style.display =
      "flex";

    sliderDots.style.display =
      "flex";


    sliderDots.innerHTML = "";


    currentPhotos.forEach(
      (_, idx) => {

        const dot =
          document.createElement("div");


        dot.className =
          `dot ${
            idx === currentPhotoIndex
              ? "active"
              : ""
          }`;


        dot.onclick = () =>
          goToSlide(idx);


        sliderDots.appendChild(dot);

      }
    );


  } else {

    btnPrevSlide.style.display =
      "none";

    btnNextSlide.style.display =
      "none";

    sliderDots.style.display =
      "none";

  }

}


function prevSlide() {

  if (currentPhotos.length <= 1)
    return;


  currentPhotoIndex =
    (
      currentPhotoIndex -
      1 +
      currentPhotos.length
    ) %
    currentPhotos.length;


  renderSlide();

}


function nextSlide() {

  if (currentPhotos.length <= 1)
    return;


  currentPhotoIndex =
    (
      currentPhotoIndex +
      1
    ) %
    currentPhotos.length;


  renderSlide();

}


function goToSlide(index) {

  currentPhotoIndex =
    index;


  renderSlide();

}


/* =========================================================
   이야기 삭제
========================================================= */

async function deleteCurrentUserStory() {

  if (!currentUserStory) {
    return;
  }


  const confirmed =
    confirm(
      "정말 이 이야기를 삭제할까요?\n\n사진과 이야기 모두 삭제됩니다."
    );


  if (!confirmed) {
    return;
  }


  try {

    const databaseId =
      currentUserStory.databaseId;


    /* --------------------------------
       1. Database 삭제
    -------------------------------- */

    await supabaseRequest(
      `/rest/v1/city_images?id=eq.${encodeURIComponent(databaseId)}`,
      {
        method: "DELETE"
      }
    );


    /* --------------------------------
       2. Storage 파일 삭제
    -------------------------------- */

    if (currentUserStory.storageUrl) {

      const marker =
        `/storage/v1/object/public/${SUPABASE_BUCKET}/`;


      const index =
        currentUserStory.storageUrl.indexOf(
          marker
        );


      if (index !== -1) {

        const filePath =
          currentUserStory.storageUrl
            .substring(
              index + marker.length
            );


        await fetch(
          `${SUPABASE_URL}/storage/v1/object/${SUPABASE_BUCKET}/${filePath}`,
          {
            method: "DELETE",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization":
                `Bearer ${SUPABASE_KEY}`
            }
          }
        );

      }

    }


    /* --------------------------------
       3. 지도에서 핀 제거
    -------------------------------- */

    if (currentUserStory._marker) {

      map.removeLayer(
        currentUserStory._marker
      );

    }


    /* 배열에서도 삭제 */

    userStories =
      userStories.filter(
        story =>
          story.databaseId !== databaseId
      );


    closeModal();


    alert(
      "이 이야기가 삭제되었습니다."
    );


  } catch (error) {

    console.error(error);


    alert(
      "삭제하지 못했습니다.\n\n" +
      error.message
    );

  }

}
