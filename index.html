<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Where story lives</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=Noto+Serif+KR:wght@300;400;600&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root {
      --bg-cream: #f7f3ed;
      --bg-card: #fdfbf7;
      --text-main: #3d352e;
      --text-sub: #7a7067;
      --border: #e8e0d5;
      --shadow: 0 12px 30px rgba(70, 55, 40, 0.09);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
    }

    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-main);
      font-family: 'Playfair Display', serif;
    }

    .title-group p {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 3px;
    }

    .header-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-header {
      background-color: var(--bg-cream);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-header:hover {
      background-color: #eee7dc;
      border-color: #c4b5a2;
    }

    .btn-header.active {
      background-color: #e5ded2;
      border-color: #9e5843;
    }

    .btn-add-story {
      background: #9e5843;
      color: white;
      border-color: #9e5843;
    }

    .btn-add-story:hover {
      background: #864734;
      border-color: #864734;
    }

    #map-container {
      flex: 1;
      position: relative;
      background: #eee8de;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .warm-ivory-tile {
      filter: sepia(35%) saturate(75%) hue-rotate(350deg) brightness(97%) contrast(95%);
    }

    .custom-pin {
      position: relative;
      cursor: pointer;
    }

    .pin-icon {
      width: 28px;
      height: 28px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2.5px solid #ffffff;
      box-shadow: 0 4px 12px rgba(60, 45, 35, 0.35);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pin-icon::after {
      content: '';
      width: 8px;
      height: 8px;
      background: #ffffff;
      border-radius: 50%;
    }

    .custom-pin:hover .pin-icon {
      transform: rotate(-45deg) scale(1.22);
    }

    .leaflet-control-zoom {
      border: none !important;
      box-shadow: var(--shadow) !important;
      border-radius: 10px !important;
      overflow: hidden;
    }

    .leaflet-control-zoom a {
      background-color: var(--bg-card) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border) !important;
      border-bottom: none !important;
      width: 34px !important;
      height: 34px !important;
      line-height: 34px !important;
      font-size: 16px !important;
    }

    .leaflet-control-zoom a:hover {
      background-color: var(--bg-cream) !important;
    }

    .leaflet-control-attribution {
      background: rgba(253, 251, 247, 0.75) !important;
      color: var(--text-sub) !important;
      font-size: 10px !important;
      padding: 3px 8px !important;
      border-radius: 4px;
      margin: 6px !important;
    }

    /* =========================
       스토리 추가 모달
    ========================= */

    .add-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(25, 20, 16, 0.65);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      opacity: 0;
      visibility: hidden;
      transition: 0.25s ease;
      padding: 20px;
    }

    .add-modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .add-modal {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 24px 60px rgba(25, 18, 12, 0.28);
      position: relative;
    }

    .add-modal h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      margin-bottom: 5px;
    }

    .add-modal-description {
      color: var(--text-sub);
      font-size: 0.8rem;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 7px;
      color: var(--text-main);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      border: 1px solid var(--border);
      background: #fffdf9;
      color: var(--text-main);
      border-radius: 8px;
      padding: 11px 12px;
      font-size: 0.85rem;
      outline: none;
      transition: 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #b98a76;
      box-shadow: 0 0 0 3px rgba(158, 88, 67, 0.08);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }

    .coordinate-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .file-input-wrapper {
      border: 1px dashed #cdbfaf;
      background: #faf7f1;
      border-radius: 8px;
      padding: 13px;
    }

    .file-input-wrapper input {
      border: none;
      padding: 0;
      background: transparent;
    }

    .add-modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 20px;
    }

    .btn-form {
      border: 1px solid var(--border);
      background: var(--bg-cream);
      color: var(--text-main);
      padding: 10px 17px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
    }

    .btn-form.primary {
      background: #9e5843;
      border-color: #9e5843;
      color: white;
    }

    .btn-form.primary:hover {
      background: #864734;
    }

    .btn-form:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .form-message {
      font-size: 0.78rem;
      margin-top: 10px;
      color: #9e5843;
      min-height: 18px;
    }

    /* =========================
       스토리 보기 모달
    ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(25, 20, 16, 0.65);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: var(--bg-card);
      width: 100%;
      max-width: 1000px;
      height: 85vh;
      max-height: 740px;
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(25, 18, 12, 0.28);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transform: translateY(20px) scale(0.98);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0) scale(1);
    }

    .btn-close-modal {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 36px;
      height: 36px;
      background: rgba(253, 251, 247, 0.92);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      color: var(--text-main);
      cursor: pointer;
      z-index: 30;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .btn-close-modal:hover {
      background: #f0eae1;
      transform: rotate(90deg) scale(1.05);
    }

    .modal-body {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      height: 100%;
      overflow: hidden;
    }

    .modal-media-slider {
      position: relative;
      background: #14110f;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    .slide-bg-blur {
      position: absolute;
      inset: -20px;
      background-size: cover;
      background-position: center;
      filter: blur(28px) brightness(0.45) saturate(1.2);
      transform: scale(1.15);
      z-index: 1;
      opacity: 0.85;
      transition: background-image 0.3s ease;
    }

    .slide-img-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .slide-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: block;
    }

    .slider-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      background: rgba(253,251,247,0.88);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--text-main);
      cursor: pointer;
      z-index: 10;
    }

    .slider-nav-btn.prev {
      left: 14px;
    }

    .slider-nav-btn.next {
      right: 14px;
    }

    .slider-bottom-bar {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .slider-caption {
      background: rgba(20,16,12,0.78);
      color: #f7f3ed;
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 6px;
      max-width: 68%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .slider-dots {
      display: flex;
      gap: 6px;
      background: rgba(20,16,12,0.55);
      padding: 6px 10px;
      border-radius: 12px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: rgba(255,255,255,0.45);
      border-radius: 50%;
      cursor: pointer;
    }

    .dot.active {
      background: white;
      width: 18px;
      border-radius: 4px;
    }

    .modal-content-area {
      padding: 30px 28px 20px;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      background: var(--bg-card);
    }

    .modal-scroll-content {
      flex: 1;
      overflow-y: auto;
      padding-right: 6px;
      margin-bottom: 12px;
    }

    .modal-header-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    .modal-author-name {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-sub);
      margin-bottom: 3px;
    }

    .modal-work-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .modal-place-name {
      font-size: 0.82rem;
      color: var(--text-sub);
      margin-bottom: 18px;
    }

    .quotes-wrapper {
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-top: 1px dashed var(--border);
      border-bottom: 1px dashed var(--border);
      padding: 18px 0;
      margin-bottom: 14px;
    }

    .quote-item {
      font-family: 'Noto Serif KR', serif;
      font-size: 0.88rem;
      line-height: 1.75;
      color: #443c34;
      position: relative;
      padding-left: 14px;
      border-left: 2.5px solid;
      word-break: keep-all;
    }

    .quote-item.commentary {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.82rem;
      line-height: 1.65;
      color: #706458;
      background: rgba(0,0,0,0.025);
      padding: 10px 12px;
      border-left-width: 3px;
      margin-top: 4px;
    }

    .modal-fixed-footer {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .modal-music-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background-color: var(--bg-cream);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .music-info {
      flex: 1;
      font-size: 0.75rem;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-footer-note {
      font-size: 0.73rem;
      color: #a3998f;
      text-align: right;
    }

    .delete-story-btn {
      margin-top: 15px;
      width: 100%;
      padding: 9px;
      border: 1px solid #d7b5ac;
      color: #9e5843;
      background: #fff8f5;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.78rem;
    }

    .delete-story-btn:hover {
      background: #f8e9e4;
    }

    @media (max-width: 860px) {
      .modal-overlay,
      .add-modal-overlay {
        padding: 10px;
      }

      .modal-card {
        height: 94vh;
        max-height: 94vh;
      }

      .modal-body {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
      }

      .modal-media-slider {
        height: 320px;
        min-height: 260px;
      }

      .modal-content-area {
        padding: 18px 16px 14px;
      }

      .modal-work-title {
        font-size: 1.25rem;
      }

      header {
        padding: 12px 16px;
      }

      .header-controls {
        gap: 5px;
      }

      .btn-header {
        padding: 7px 9px;
      }

      .btn-add-story {
        font-size: 0.75rem;
      }
    }

    @media (max-width: 480px) {
      .title-group h1 {
        font-size: 1.1rem;
      }

      .title-group p {
        display: none;
      }

      .modal-media-slider {
        height: 260px;
      }

      .add-modal {
        padding: 22px 18px;
      }

      .coordinate-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="title-group">
    <h1>Where story lives</h1>
    <p>문학과 영화 속 장소로 떠나보세요 · 핀을 누르면 음악과 이야기가 펼쳐집니다</p>
  </div>

  <div class="header-controls">
    <button class="btn-header btn-add-story" onclick="openAddStoryModal()">
      ＋ Add Your Story
    </button>

    <button id="btnToggleBgm" class="btn-header" onclick="toggleMainBgm()">
      <span id="bgmIcon">🎵</span>
      <span id="bgmText">배경음악 ON</span>
    </button>

    <button class="btn-header" onclick="resetView()">
      초기 위치로
    </button>
  </div>
</header>

<div id="map-container">
  <div id="map"></div>
</div>


<!-- =========================
     Add Your Story 모달
========================= -->

<div id="addStoryModal" class="add-modal-overlay" onclick="handleAddOverlayClick(event)">
  <div class="add-modal">

    <button class="btn-close-modal" onclick="closeAddStoryModal()">✕</button>

    <h2>Add Your Story</h2>

    <p class="add-modal-description">
      당신의 이야기가 머물렀던 장소를 지도에 남겨보세요.
    </p>

    <form id="storyForm" onsubmit="submitStory(event)">

      <div class="form-group">
        <label for="nickname">누구의 이야기인가요?</label>
        <input
          type="text"
          id="nickname"
          placeholder="닉네임을 입력해주세요"
          required
          maxlength="50"
        />
      </div>

      <div class="form-group">
        <label for="cityName">어디의 이야기인가요?</label>
        <input
          type="text"
          id="cityName"
          placeholder="예: 대한민국 서울"
          required
          maxlength="100"
        />
      </div>

      <div class="form-group">
        <label>장소의 위치</label>

        <div class="coordinate-row">
          <input
            type="number"
            id="latitude"
            placeholder="위도 (예: 37.5665)"
            step="any"
            required
          />

          <input
            type="number"
            id="longitude"
            placeholder="경도 (예: 126.9780)"
            step="any"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="storyImage">사진</label>

        <div class="file-input-wrapper">
          <input
            type="file"
            id="storyImage"
            accept="image/*"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="quote">당신의 문장 / 명대사</label>

        <textarea
          id="quote"
          placeholder="이 장소에 남기고 싶은 이야기나 문장을 적어주세요."
          required
          maxlength="2000"
        ></textarea>
      </div>

      <div id="formMessage" class="form-message"></div>

      <div class="add-modal-buttons">
        <button
          type="button"
          class="btn-form"
          onclick="closeAddStoryModal()"
        >
          취소
        </button>

        <button
          type="submit"
          id="submitStoryBtn"
          class="btn-form primary"
        >
          이야기 남기기
        </button>
      </div>

    </form>
  </div>
</div>


<!-- =========================
     Story 보기 모달
========================= -->

<div id="storyModal" class="modal-overlay" onclick="handleOverlayClick(event)">

  <div class="modal-card">

    <button class="btn-close-modal" onclick="closeModal()">✕</button>

    <div class="modal-body">

      <div class="modal-media-slider">

        <div id="slideBgBlur" class="slide-bg-blur"></div>

        <div class="slide-img-wrapper">
          <img id="slideImg" class="slide-img" src="" alt="장소 사진" />
        </div>

        <button
          id="btnPrevSlide"
          class="slider-nav-btn prev"
          onclick="prevSlide()"
        >
          ‹
        </button>

        <button
          id="btnNextSlide"
          class="slider-nav-btn next"
          onclick="nextSlide()"
        >
          ›
        </button>

        <div class="slider-bottom-bar">

          <div id="slideCaption" class="slider-caption"></div>

          <div id="sliderDots" class="slider-dots"></div>

        </div>
      </div>


      <div class="modal-content-area">

        <div class="modal-scroll-content">

          <span id="modalTag" class="modal-header-tag"></span>

          <div id="modalAuthor" class="modal-author-name"></div>

          <h2 id="modalTitle" class="modal-work-title"></h2>

          <div id="modalPlace" class="modal-place-name"></div>

          <div id="modalQuotes" class="quotes-wrapper"></div>

          <button
            id="deleteStoryBtn"
            class="delete-story-btn"
            style="display:none;"
            onclick="deleteCurrentUserStory()"
          >
            🗑 이 이야기 삭제하기
          </button>

        </div>

        <div class="modal-fixed-footer">

          <div
            id="musicBarContainer"
            class="modal-music-bar"
            style="display:none;"
          >
            <span>🎶</span>

            <span
              id="modalMusicTitle"
              class="music-info"
            >
              재생 중인 테마곡
            </span>
          </div>

          <div class="modal-footer-note">
            Where story lives Collection
          </div>

        </div>

      </div>

    </div>
  </div>
</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>


<script>
/* =========================================================
   SUPABASE 설정
========================================================= */

const SUPABASE_URL =

function autoStartBgmOnce() {

  if (!isMainBgmPlaying) {

    mainBgm.play()
      .then(() => {

        isMainBgmPlaying = true;

        updateBgmButtonUI();

      })
      .catch(() => {});

  }

  document.removeEventListener(
    "click",
    autoStartBgmOnce
  );
}

  "click",
  autoStartBgmOnce,
  { once: true }
);


function toggleMainBgm() {

  if (isMainBgmPlaying) {

    mainBgm.pause();

    isMainBgmPlaying = false;

  } else {

    mainBgm.play()
      .then(() => {

        isMainBgmPlaying = true;

        updateBgmButtonUI();

      })
      .catch(() => {});

  }

  updateBgmButtonUI();
}


function updateBgmButtonUI() {

  const btn =
    document.getElementById("btnToggleBgm");

  const icon =
    document.getElementById("bgmIcon");

  const text =
    document.getElementById("bgmText");

  if (isMainBgmPlaying) {

    btn.classList.add("active");

    icon.textContent = "🎵";

    text.textContent = "배경음악 ON";

  } else {

    btn.classList.remove("active");

    icon.textContent = "🔇";

    text.textContent = "배경음악 OFF";
  }
}

/* =========================================================
   사용자 스토리 색상 자동 결정
========================================================= */

function getUserStoryPinColor(placeName) {

  const colors = [
    "#397f8f",
    "#5f7891",
    "#c87586",
    "#668052",
    "#c87542",
    "#69527d",
    "#8a6250",
    "#8b6f47",
    "#6d6875",
    "#9b5963",
    "#52796f",
    "#806b5b"
  ];

  let hash = 0;

  for (let i = 0; i < placeName.length; i++) {

    hash =
      placeName.charCodeAt(i) +
      ((hash << 5) - hash);

    hash |= 0;
  }

  return colors[
    Math.abs(hash) % colors.length
  ];
}


/* =========================================================
   태그 색상도 핀에 맞춰 자동 생성
========================================================= */

function getTagColors(pinColor) {

  return {
    background:
      pinColor + "22",

    text:
      pinColor
  };
}

function createMarker(item, isUserStory = false) {

  const pinColor =
    isUserStory
      ? getUserStoryPinColor(item.name)
      : item.pinColor;


  const customIcon = L.divIcon({

    className: "custom-pin",

    html:
      `<div class="pin-icon"
        style="background-color:${pinColor};">
      </div>`,

    iconSize: [28, 28],

    iconAnchor: [14, 28]

  });


  const marker =
    L.marker(
      item.latlng,
      {
        icon: customIcon
      }
    ).addTo(map);


  marker.on("click", () => {

    openStoryModal(
      item,
      isUserStory
    );

  });


  return marker;
}


/* =========================================================
   기존 8개 핀 표시
========================================================= */

storyPlaces.forEach(item => {

  createMarker(item, false);

});


/* =========================================================
   모달 DOM
========================================================= */

const modal =
  document.getElementById("storyModal");

const slideImg =
  document.getElementById("slideImg");

const slideBgBlur =
  document.getElementById("slideBgBlur");

const slideCaption =
  document.getElementById("slideCaption");

const sliderDots =
  document.getElementById("sliderDots");

const btnPrevSlide =
  document.getElementById("btnPrevSlide");

const btnNextSlide =
  document.getElementById("btnNextSlide");

const modalTag =
  document.getElementById("modalTag");

const modalAuthor =
  document.getElementById("modalAuthor");

const modalTitle =
  document.getElementById("modalTitle");

const modalPlace =
  document.getElementById("modalPlace");

const modalQuotes =
  document.getElementById("modalQuotes");

const musicBarContainer =
  document.getElementById("musicBarContainer");

const modalMusicTitle =
  document.getElementById("modalMusicTitle");

const deleteStoryBtn =
  document.getElementById("deleteStoryBtn");


let currentPhotos = [];

let currentPhotoIndex = 0;

let currentUserStoryId = null;


/* =========================================================
   Story 모달 열기
========================================================= */

function openStoryModal(item, isUserStory = false) {

  currentPhotos =
    item.photos || [];

  currentPhotoIndex = 0;

  currentUserStoryId =
    isUserStory
      ? item.id
      : null;


  if (isUserStory) {

    modalTag.textContent =
      "누군가의 이야기";

    const colors =
      getTagColors(
        getUserStoryPinColor(item.name)
      );

    modalTag.style.backgroundColor =
      colors.background;

    modalTag.style.color =
      colors.text;

    modalAuthor.textContent =
      item.nickname
        ? `${item.nickname}의 이야기`
        : "익명의 이야기";

    modalTitle.textContent =
      item.title || item.name;

    modalPlace.textContent =
      `📍 ${item.name}`;

    deleteStoryBtn.style.display =
      "block";

  } else {

    modalTag.textContent =
      item.type === "book"
        ? "소설 속 문장 & 실제 장소"
        : item.type === "drama"
          ? "드라마 속 명대사 & 장면"
          : "영화 속 명대사 & 장면";

    modalTag.style.backgroundColor =
      item.tagBg;

    modalTag.style.color =
      item.tagColor;

    modalAuthor.textContent =
      item.author || "";

    modalTitle.textContent =
      item.title || "";

    modalPlace.textContent =
      `📍 ${item.name}`;

    deleteStoryBtn.style.display =
      "none";
  }


  modalQuotes.innerHTML = "";


  (item.quotes || []).forEach(
    (quote, idx) => {

      const quoteEl =
        document.createElement("div");

      if (
        !isUserStory &&
        (
          item.id === "in-the-mood-for-love" ||
          item.id === "summer"
        ) &&
        idx === item.quotes.length - 1
      ) {

        quoteEl.className =
          "quote-item commentary";

      } else {

        quoteEl.className =
          "quote-item";
      }


      const pinColor =
        isUserStory
          ? getUserStoryPinColor(item.name)
          : item.pinColor;


      quoteEl.style.borderLeftColor =
        pinColor;


      quoteEl.innerHTML =
        escapeHtml(quote)
          .replace(/\n/g, "<br>");


      modalQuotes.appendChild(
        quoteEl
      );

    }
  );


  if (
    item.audioSrc &&
    !isUserStory
  ) {

    musicBarContainer.style.display =
      "flex";

    modalMusicTitle.textContent =
      `재생 중: ${
        item.audioTitle ||
        item.audioSrc
      }`;


    if (isMainBgmPlaying) {

      mainBgm.pause();

    }


    placeAudio.src =
      item.audioSrc;

    placeAudio.currentTime =
      item.startTime || 0;

    placeAudio.play()
      .catch(() => {});


  } else {

    musicBarContainer.style.display =
      "none";

    placeAudio.pause();

  }


  renderSlide();

  modal.classList.add(
    "active"
  );
}


/* =========================================================
   HTML 특수문자 방지
========================================================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;
}


/* =========================================================
   사진 슬라이더
========================================================= */

function renderSlide() {

  if (
    currentPhotos.length === 0
  ) {

    slideImg.src = "";

    slideCaption.textContent =
      "";

    return;
  }


  const current =
    currentPhotos[
      currentPhotoIndex
    ];


  slideImg.src =
    current.url;

  slideBgBlur.style.backgroundImage =
    `url('${current.url}')`;

  slideCaption.textContent =
    current.caption || "";


  if (
    currentPhotos.length > 1
  ) {

    btnPrevSlide.style.display =
      "flex";

    btnNextSlide.style.display =
      "flex";

    sliderDots.style.display =
      "flex";


    sliderDots.innerHTML = "";


    currentPhotos.forEach(
      (_, idx) => {

        const dot =
          document.createElement("div");

        dot.className =
          `dot ${
            idx === currentPhotoIndex
              ? "active"
              : ""
          }`;

        dot.onclick = () =>
          goToSlide(idx);

        sliderDots.appendChild(
          dot
        );

      }
    );


  } else {

    btnPrevSlide.style.display =
      "none";

    btnNextSlide.style.display =
      "none";

    sliderDots.style.display =
      "none";

  }
}


function prevSlide() {

  if (
    currentPhotos.length <= 1
  ) return;

  currentPhotoIndex =
    (
      currentPhotoIndex -
      1 +
      currentPhotos.length
    ) %
    currentPhotos.length;

  renderSlide();
}


function nextSlide() {

  if (
    currentPhotos.length <= 1
  ) return;

  currentPhotoIndex =
    (
      currentPhotoIndex +
      1
    ) %
    currentPhotos.length;

  renderSlide();
}


function goToSlide(idx) {

  currentPhotoIndex =
    idx;

  renderSlide();
}


/* =========================================================
   Story 모달 닫기
========================================================= */

function closeModal() {

  modal.classList.remove(
    "active"
  );

  placeAudio.pause();

  placeAudio.currentTime =
    0;


  if (isMainBgmPlaying) {

    mainBgm.play()
      .catch(() => {});

  }

  currentUserStoryId =
    null;
}


function handleOverlayClick(event) {

  if (
    event.target === modal
  ) {

    closeModal();

  }
}


/* =========================================================
   Add Your Story 모달
========================================================= */

const addStoryModal =
  document.getElementById(
    "addStoryModal"
  );


function openAddStoryModal() {

  addStoryModal.classList.add(
    "active"
  );

}


function closeAddStoryModal() {

  addStoryModal.classList.remove(
    "active"
  );

}


function handleAddOverlayClick(event) {

  if (
    event.target === addStoryModal
  ) {

    closeAddStoryModal();

  }

}


/* =========================================================
   Supabase에 Story 저장
========================================================= */

async function submitStory(event) {

  event.preventDefault();


  const submitBtn =
    document.getElementById(
      "submitStoryBtn"
    );

  const message =
    document.getElementById(
      "formMessage"
    );


  const nickname =
    document.getElementById(
      "nickname"
    ).value.trim();


  const cityName =
    document.getElementById(
      "cityName"
    ).value.trim();


  const latitude =
    parseFloat(
      document.getElementById(
        "latitude"
      ).value
    );


  const longitude =
    parseFloat(
      document.getElementById(
        "longitude"
      ).value
    );


  const quote =
    document.getElementById(
      "quote"
    ).value.trim();


  const imageInput =
    document.getElementById(
      "storyImage"
    );


  const file =
    imageInput.files[0];


  message.textContent =
    "";


  if (!nickname) {

    message.textContent =
      "닉네임을 입력해주세요.";

    return;
  }


  if (!cityName) {

    message.textContent =
      "장소를 입력해주세요.";

    return;
  }


  if (
    isNaN(latitude) ||
    latitude < -90 ||
    latitude > 90
  ) {

    message.textContent =
      "위도는 -90에서 90 사이로 입력해주세요.";

    return;
  }


  if (
    isNaN(longitude) ||
    longitude < -180 ||
    longitude > 180
  ) {

    message.textContent =
      "경도는 -180에서 180 사이로 입력해주세요.";

    return;
  }


  if (!file) {

    message.textContent =
      "사진을 선택해주세요.";

    return;
  }


  try {

    submitBtn.disabled =
      true;

    submitBtn.textContent =
      "업로드 중...";


    /* -------------------------
       1. 사진 파일명 생성
    ------------------------- */

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const uniqueFileName =
      `${Date.now()}-${Math.random()
        .toString(36)
        .substring(2, 9)}.${extension}`;


    const storagePath =
      `user-stories/${uniqueFileName}`;


    /* -------------------------
       2. Storage 업로드
    ------------------------- */

    const uploadResponse =
      await fetch(
        `${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${storagePath}`,
        {

          method: "POST",

          headers: {

            apikey:
              SUPABASE_KEY,

            Authorization:
              `Bearer ${SUPABASE_KEY}`,

            "Content-Type":
              file.type

          },

          body: file

        }
      );


    if (!uploadResponse.ok) {

      const errorText =
        await uploadResponse.text();

      console.error(
        "Storage upload error:",
        errorText
      );

      throw new Error(
        "사진 업로드에 실패했습니다."
      );
    }


    /* -------------------------
       3. 공개 이미지 URL 생성
    ------------------------- */

    const imageUrl =
      `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${storagePath}`;


    /* -------------------------
       4. Database 저장
    ------------------------- */

    const insertResponse =
      await fetch(
        CITY_TABLE,
        {

          method: "POST",

          headers: {

            apikey:
              SUPABASE_KEY,

            Authorization:
              `Bearer ${SUPABASE_KEY}`,

            "Content-Type":
              "application/json",

            Prefer:
              "return=representation"

          },

          body: JSON.stringify({

            city_name:
              cityName,

            image_url:
              imageUrl,

            nickname:
              nickname,

            quote:
              quote,

            lat:
              latitude,

            lng:
              longitude

          })

        }
      );


    if (!insertResponse.ok) {

      const errorText =
        await insertResponse.text();

      console.error(
        "Database insert error:",
        errorText
      );

      throw new Error(
        "이야기 저장에 실패했습니다."
      );
    }


    const savedRows =
      await insertResponse.json();


    const savedStory =
      savedRows[0];


    /* -------------------------
       5. 새 장소를 지도에 즉시 표시
    ------------------------- */

    const newStory = {

      id:
        savedStory.id,

      name:
        savedStory.city_name,

      nickname:
        savedStory.nickname,

      title:
        savedStory.city_name,

      latlng: [

        Number(
          savedStory.lat
        ),

        Number(
          savedStory.lng
        )

      ],

      photos: [

        {

          url:
            savedStory.image_url,

          caption:
            `${savedStory.nickname}의 사진`

        }

      ],

      quotes: [

        savedStory.quote

      ]

    };


    createMarker(
      newStory,
      true
    );


    /* -------------------------
       6. 완료
    ------------------------- */

    message.style.color =
      "#668052";

    message.textContent =
      "이야기가 지도에 남겨졌어요.";


    document.getElementById(
      "storyForm"
    ).reset();


    setTimeout(() => {

      closeAddStoryModal();

      message.textContent = "";

      message.style.color =
        "#9e5843";

    }, 900);


  } catch (error) {

    console.error(error);

    message.style.color =
      "#9e5843";

    message.textContent =
      error.message ||
      "오류가 발생했습니다.";


  } finally {

    submitBtn.disabled =
      false;

    submitBtn.textContent =
      "이야기 남기기";

  }
}


/* =========================================================
   Supabase에서 사용자 Story 불러오기
========================================================= */

async function loadUserStories() {

  try {

    const response =
      await fetch(
        `${CITY_TABLE}?select=*`,
        {

          method: "GET",

          headers: {

            apikey:
              SUPABASE_KEY,

            Authorization:
              `Bearer ${SUPABASE_KEY}`

          }

        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Story load error:",
        errorText
      );

      return;
    }


    const rows =
      await response.json();


    rows.forEach(
      row => {

        if (
          row.lat === null ||
          row.lng === null
        ) {

          return;
        }


        if (
          !row.image_url
        ) {

          return;
        }


        const userStory = {

          id:
            row.id,

          name:
            row.city_name,

          nickname:
            row.nickname,

          title:
            row.city_name,

          latlng: [

            Number(row.lat),

            Number(row.lng)

          ],

          photos: [

            {

              url:
                row.image_url,

              caption:
                `${row.nickname || "누군가"}의 사진`

            }

          ],

          quotes: [

            row.quote ||
            ""

          ]

        };


        createMarker(
          userStory,
          true
        );

      });


  } catch (error) {

    console.error(
      "사용자 스토리를 불러오는 중 오류:",
      error
    );

  }
}


/* =========================================================
   사용자 Story 삭제
========================================================= */

async function deleteCurrentUserStory() {

  if (
    !currentUserStoryId
  ) {

    return;

  }


  const confirmed =
    confirm(
      "이 이야기를 정말 삭제할까요?"
    );


  if (!confirmed) {

    return;

  }


  try {

    deleteStoryBtn.disabled =
      true;

    deleteStoryBtn.textContent =
      "삭제 중...";


    const response =
      await fetch(
        `${CITY_TABLE}?id=eq.${encodeURIComponent(currentUserStoryId)}`,
        {

          method: "DELETE",

          headers: {

            apikey:
              SUPABASE_KEY,

            Authorization:
              `Bearer ${SUPABASE_KEY}`,

            Prefer:
              "return=minimal"

          }

        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Delete error:",
        errorText
      );

      throw new Error(
        "삭제에 실패했습니다."
      );
    }


    closeModal();


    alert(
      "이야기가 삭제되었습니다."
    );


    location.reload();


  } catch (error) {

    console.error(error);

    alert(
      error.message ||
      "삭제 중 오류가 발생했습니다."
    );


  } finally {

    deleteStoryBtn.disabled =
      false;

    deleteStoryBtn.textContent =
      "🗑 이 이야기 삭제하기";

  }
}


/* =========================================================
   초기 위치
========================================================= */

function resetView() {

  map.flyTo(
    initialCenter,
    initialZoom,
    {
      duration: 1.2
    }
  );

}


/* =========================================================
   키보드
========================================================= */

window.addEventListener(
  "keydown",
  (e) => {

    if (
      modal.classList.contains(
        "active"
      )
    ) {

      if (
        e.key === "Escape"
      ) {

        closeModal();

      }

      if (
        e.key === "ArrowLeft"
      ) {

        prevSlide();

      }

      if (
        e.key === "ArrowRight"
      ) {

        nextSlide();

      }

    }


    if (
      addStoryModal.classList.contains(
        "active"
      ) &&
      e.key === "Escape"
    ) {

      closeAddStoryModal();

    }

  }
);


/* =========================================================
   페이지가 열리면 Supabase Story 불러오기
========================================================= */

loadUserStories();

</script>
